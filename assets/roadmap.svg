<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img" aria-label="Five-year roadmap from foundations through possible graduate study">
  <rect width="840" height="160" rx="14" fill="#11243c"/>
  <path d="M90 60 H750" stroke="#b3a369" stroke-width="3"/>
  <g fill="#d8c88d">
    <circle cx="90" cy="60" r="8"/><circle cx="255" cy="60" r="8"/>
    <circle cx="420" cy="60" r="8"/><circle cx="585" cy="60" r="8"/>
    <circle cx="750" cy="60" r="8"/>
  </g>
  <g text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#fffdf8">
